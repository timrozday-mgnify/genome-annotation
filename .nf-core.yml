repository_type: pipeline

nf_core_version: 3.3.2

# Ignored because they are rules about pipelines published in the nf-core
# organisation, not about pipeline quality. This one lives in
# timrozday-mgnify/genome-annotation and follows the template otherwise; see
# CLAUDE.md, "nf-core standards compliant but lightweight -- remove bloat, not
# standards".
lint:
  # `manifest.homePage` must start with https://github.com/nf-core/. It cannot.
  nextflow_config:
    - manifest.homePage
    # nf-core/configs is the shared institutional-config repository for nf-core
    # pipelines. This one ships its own `codon` and `local` profiles instead, and
    # loading the remote config on every run would be a surprise, not a feature.
    - params.custom_config_version
    - params.custom_config_base
    - custom_config
  files_exist:
    # nf-core's community Code of Conduct, which governs the nf-core Slack and
    # repositories rather than this one.
    - CODE_OF_CONDUCT.md
    # The completion-email templates and the nf-core logo they embed. Their only
    # reader was `completionEmail`/`imNotification` in PIPELINE_COMPLETION, which
    # this pipeline never wired up; shipping them would be dead files.
    - assets/email_template.html
    - assets/email_template.txt
    - assets/sendmail_template.txt
    - assets/nf-core-genomeannotation_logo_light.png

template:
  org: nf-core
  name: genomeannotation
  description: Simple functional annotation of genomes
  author: "@timrozday-mgnify"
  version: 1.0.0dev
  force: true
  outdir: .
  is_nfcore: true
